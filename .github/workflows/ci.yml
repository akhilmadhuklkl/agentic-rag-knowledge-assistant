name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install dependency security scanner
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Run tests
        run: python -m pytest -q

      - name: Validate API security contract
        run: python -m pytest tests/test_api_contracts.py tests/test_api_health.py tests/test_request_context.py -q

      - name: Run lint
        run: ruff check src tests

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Check patch formatting
        run: git diff --check
